<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard — Aizaz Ali Portfolio</title>
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="stars-bg" id="starsBg">
  <div class="floating-ball ball-1"></div>
  <div class="floating-ball ball-2"></div>
  <div class="floating-ball ball-3"></div>
</div>
<div class="toast-container" id="toastContainer"></div>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>Admin Dashboard</h1>
        <p>Professional Portfolio Manager</p>
      </div>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit" class="btn-login">Log In</button>
        <p class="form-status" id="loginStatus"></p>
      </form>
      <p class="forgot-password-row"><a href="#" id="forgotPasswordLink">Forgot password?</a></p>
    </div>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div class="admin-dashboard" id="adminApp" style="display:none;">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <h2>Aizaz Ali</h2>
      <span class="sidebar-role">Admin<span class="status-dot-live"></span></span>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-tab="dashboard">Dashboard</button>
      <button class="nav-item" data-tab="analytics">Analytics</button>
      <button class="nav-item" data-tab="portfolio_builder">Portfolio Builder</button>
      <button class="nav-item" data-tab="profile">Profile</button>
      <button class="nav-item" data-tab="projects">Projects</button>
      <button class="nav-item" data-tab="skill_categories">Skills</button>
      <button class="nav-item" data-tab="experience">Experience</button>
      <button class="nav-item" data-tab="education">Education</button>
      <button class="nav-item" data-tab="certifications">Certifications</button>
      <button class="nav-item" data-tab="testimonials">Testimonials</button>
      <button class="nav-item" data-tab="social_links">Social Links</button>
      <button class="nav-item" data-tab="contact_messages">Messages</button>
      <button class="nav-item" data-tab="settings">Settings</button>
      <button class="nav-item" data-tab="activity_log">Activity Log</button>
    </nav>

    <div class="sidebar-footer">
      <p class="user-email" id="userEmail"></p>
      <button class="btn-secondary" id="changePasswordBtn">Change Password</button>
      <button class="btn-logout" id="logoutBtn">Log Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="header-actions">
        <input type="text" class="search-box" id="searchBox" placeholder="Search..." style="display:none;">
        <div class="notif-wrap" id="notifWrap">
          <button class="btn-notif" id="notifBell" title="Notifications">
            🔔<span class="notif-badge" id="notifBadge" style="display:none;">0</span>
          </button>
          <div class="notif-dropdown" id="notifDropdown" style="display:none;">
            <div class="notif-dropdown-header">
              <span>Notifications</span>
              <button type="button" class="notif-mark-all" id="notifMarkAll">Mark all seen</button>
            </div>
            <div class="notif-list" id="notifList"></div>
          </div>
        </div>
        <span class="live-clock" id="liveClock"></span>
        <button class="btn-theme" id="themeToggle">🌙</button>
      </div>
    </div>

    <div id="tabContent" class="tab-content"></div>
  </main>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">Add Item</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <form id="modalForm" class="modal-form"></form>
  </div>
</div>

<div class="modal-overlay" id="passwordModalOverlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Change Password</h3>
      <button class="modal-close" id="passwordModalClose">✕</button>
    </div>
    <form id="passwordForm" class="modal-form">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" minlength="6" required />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" minlength="6" required />
      </div>
      <button type="submit" class="btn-primary">Update Password</button>
      <p class="form-status" id="passwordStatus"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script>
  // Dynamic favicon — same custom icon set from the Settings tab applies here too.
  supabaseClient.from("settings").select("value").eq("key", "favicon_url").maybeSingle()
    .then(({ data }) => {
      if (data?.value) {
        document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"]').forEach(l => { l.href = data.value; });
      }
    })
    .catch(() => { /* ignore — static favicon files still apply */ });
</script>
<script src="js/admin.js"></script>
</body>
</html>
